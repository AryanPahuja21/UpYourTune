services:
  app:
    build: .
    container_name: my_app_container
    ports:
      - "3000:3000"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

  redis:
   image: redis:4.0.14
   container_name: redis_container
   ports:
     - "6379:6379"
   volumes:
     - redis-data:/data


volumes:
  redis-data:
